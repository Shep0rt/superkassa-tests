superkassa {
  base-url = "http://localhost:8080"
  base-url = ${?SUPERKASSA_BASE_URL}

  api-token = "local-token"
  api-token = ${?SUPERKASSA_API_TOKEN}
}

database {
  jdbc-url = "jdbc:postgresql://localhost:5432/superkassa"
  jdbc-url = ${?SUPERKASSA_DB_JDBC_URL}

  username = "readonly"
  username = ${?SUPERKASSA_DB_USERNAME}

  password = "readonly"
  password = ${?SUPERKASSA_DB_PASSWORD}
}

timeouts {
  default = 30 seconds
  polling-interval = 1 second
}
